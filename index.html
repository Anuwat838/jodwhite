<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4A9EF6" />
<title>JodWhite</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="favicon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@600;700&display=swap" rel="stylesheet" />

<!-- ═══════════════════════════════════════════════════════════════
     JodWhite v2 — แอปบันทึกงานส่วนตัว (SaaS, multi-tenant)
     v2: เตือนฝั่งเซิร์ฟเวอร์ · รูปบน Storage · ออฟไลน์ · ค้นหา · ถังขยะ · TH/EN
     ═══════════════════════════════════════════════════════════════ -->

<style>
  :root{
    --brand:#4A9EF6; --brand-dark:#2B7FD4;
    --brand-tint:#E7F1FE; --brand-tint2:#F2F8FF;
    --ink:#16233A; --muted:#5E6E85; --faint:#8E9DB2;
    --bg:#F5F8FD; --card:#FFFFFF;
    --line:#E3EAF4; --line-strong:#CBD7E7;
    --danger:#D6453F; --danger-tint:#FBEAEA;
    --amber:#D69A00; --amber-tint:#FBF2DC;
    --pending:#8496AC; --pending-tint:#EDF1F7;
    --shadow:0 1px 2px rgba(22,35,58,.06), 0 4px 16px rgba(22,35,58,.05);
    --shadow-lg:0 8px 30px rgba(22,35,58,.14);
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wm,.num{font-family:"Kanit",sans-serif;letter-spacing:.2px}
  h1,h2,h3{font-family:inherit;font-weight:600;letter-spacing:-.1px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  a{color:var(--brand-dark)}
  .hidden{display:none !important}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;
    transition:transform .05s ease, background .15s ease}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(74,158,246,.30)}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:var(--brand-tint);color:var(--brand-dark)}
  .btn-line{background:#EFF4FA;color:var(--ink);border:1px solid var(--line)}
  .btn-danger{background:var(--danger-tint);color:var(--danger)}
  .btn-block{display:flex;width:100%}
  .btn:disabled{opacity:.5;pointer-events:none}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ── Language toggle ── */
  .lang-tog{display:inline-flex;background:var(--brand-tint);border-radius:20px;padding:2px;gap:1px}
  .lang-tog button{padding:4px 11px;border-radius:18px;font-size:12px;font-weight:700;color:var(--muted)}
  .lang-tog button.active{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow)}

  /* ── Auth ── */
  #auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 500px at 50% -10%, #DCEBFD 0%, transparent 60%), var(--bg)}
  .auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:28px 26px;box-shadow:var(--shadow-lg)}
  .auth-top{display:flex;justify-content:flex-end;margin-bottom:6px}
  .brand{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:20px}
  .logo-mark{width:56px;height:56px;border-radius:16px;
    background:linear-gradient(145deg,var(--brand),var(--brand-dark));
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(74,158,246,.34)}
  .logo-mark svg{width:32px;height:32px}
  .wm{font-size:27px;font-weight:700}
  .wm .jod{color:var(--brand)} .wm .white{color:var(--ink)}
  .tagline{color:var(--muted);font-size:13.5px;text-align:center}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .input{width:100%;padding:12px 13px;border:1.5px solid var(--line-strong);border-radius:11px;
    background:#fff;color:var(--ink);transition:border .15s, box-shadow .15s}
  .input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(74,158,246,.16)}
  textarea.input{resize:vertical;min-height:76px}
  .auth-switch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
  .auth-switch button{color:var(--brand-dark);font-weight:600;padding:2px 4px}
  .auth-msg{font-size:13.5px;padding:10px 12px;border-radius:10px;margin-bottom:13px;display:none}
  .auth-msg.err{display:block;background:var(--danger-tint);color:var(--danger)}
  .auth-msg.ok{display:block;background:var(--brand-tint);color:var(--brand-dark)}
  .link-btn{color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
  .legal{text-align:center;font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.6}

  /* ── Shell ── */
  #app{min-height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(247,249,243,.88);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
  .topbar .wm{font-size:20px}
  .topbar .logo-mark{width:34px;height:34px;border-radius:10px;box-shadow:none}
  .topbar .logo-mark svg{width:20px;height:20px}
  .spacer{flex:1}
  .icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
    justify-content:center;color:var(--muted)}
  .icon-btn:hover{background:var(--brand-tint);color:var(--brand-dark)}
  .icon-btn svg{width:21px;height:21px}
  .profile-switch{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;
    background:var(--brand-tint);color:var(--brand-dark);font-weight:600;font-size:13.5px;max-width:170px}
  .profile-switch .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
  .profile-switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .profile-switch svg{width:15px;height:15px;flex:none}

  main{flex:1;padding:14px 16px 108px}
  .screen{display:none;animation:fade .22s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  .offline-chip{display:none;align-items:center;gap:7px;background:var(--amber-tint);
    border:1px solid #EBD79A;color:#8A6A00;padding:8px 12px;border-radius:11px;
    font-size:12.5px;margin-bottom:12px}
  .offline-chip.show{display:flex}
  .verify-banner{display:none;align-items:center;gap:10px;background:var(--amber-tint);
    border:1px solid #EBD79A;color:#8A6A00;padding:10px 13px;border-radius:12px;font-size:13px;margin-bottom:14px}
  .verify-banner button{color:#8A6A00;font-weight:700;text-decoration:underline;font-size:13px}

  .screen-head{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px}
  .screen-head h2{font-size:21px;margin:0}
  .screen-head .sub{color:var(--muted);font-size:13px}

  /* ── Quick add + search ── */
  .quickadd{display:flex;gap:8px;margin-bottom:12px}
  .quickadd input{flex:1;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:#fff}
  .quickadd input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(74,158,246,.16)}
  .quickadd button{width:46px;border-radius:12px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;flex:none}
  .quickadd button svg{width:21px;height:21px}
  .searchbox{position:relative;margin-bottom:14px}
  .searchbox input{width:100%;padding:11px 38px 11px 38px;border:1.5px solid var(--line);
    border-radius:12px;background:#fff}
  .searchbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(74,158,246,.16)}
  .searchbox .s-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:var(--faint);pointer-events:none}
  .searchbox .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;
    background:var(--line);color:var(--muted)}
  .searchbox .s-clear.show{display:flex}

  /* แถบเตือนงานที่ยังไม่กำหนดวัน */
  .nodate-bar{margin:-4px 0 12px}
  .nodate-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;
    background:var(--amber-tint);border:1px solid #EBD79A;color:#8A6A00;
    font-size:13px;font-weight:600;transition:transform .05s}
  .nodate-chip:active{transform:scale(.97)}
  .nodate-chip svg{width:15px;height:15px;flex:none}
  .nodate-chip.active{background:#8A6A00;border-color:#8A6A00;color:#fff}

  /* ── Task card ── */
  .task{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow);transition:transform .06s}
  .task:active{transform:scale(.994)}
  .task.done{opacity:.62}
  .task.overdue{border-color:#F0C9C7}
  .task-top{display:flex;align-items:flex-start;gap:11px}
  .status-pill{flex:none;margin-top:2px}
  .status-pill button{width:26px;height:26px;border-radius:50%;border:2px solid var(--pending);
    display:flex;align-items:center;justify-content:center;background:#fff;transition:all .15s}
  .status-pill button svg{width:15px;height:15px}
  .status-pill.s-doing button{border-color:var(--amber);background:var(--amber)}
  .status-pill.s-done button{border-color:var(--brand);background:var(--brand)}
  .task-body{flex:1;min-width:0}
  .task-title{font-weight:600;font-size:15.5px;word-break:break-word}
  .task.done .task-title{text-decoration:line-through;text-decoration-color:var(--faint)}
  .task-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .task-meta .m{display:inline-flex;align-items:center;gap:4px}
  .task-meta svg{width:13px;height:13px;opacity:.8}
  .task-meta .due.late{color:var(--danger);font-weight:600}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;
    background:var(--brand-tint);color:var(--brand-dark);margin-top:7px}
  .task-detail-txt{font-size:13px;color:var(--muted);margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .task-thumb{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:9px}
  .sub-prog{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:6px}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty .em-ic{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:var(--brand-tint);
    display:flex;align-items:center;justify-content:center}
  .empty .em-ic svg{width:28px;height:28px;color:var(--brand)}
  .empty h3{margin:0 0 4px;font-size:16px;color:var(--ink)}
  .empty p{margin:0;font-size:13.5px}
  .day-label{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;
    letter-spacing:.6px;margin:16px 2px 8px}
  .sub-day{font-size:12.5px;font-weight:600;color:var(--brand-dark);margin:10px 2px 6px}
  .done-toggle{display:flex;align-items:center;gap:7px;width:100%;margin:18px 0 4px;padding:6px 2px;
    font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.6px}
  .done-toggle .chev{width:15px;height:15px;transition:transform .2s}
  .done-toggle.open .chev{transform:rotate(180deg)}
  .done-wrap{animation:fade .2s ease}

  /* ── FAB + nav ── */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + var(--safe-b));
    z-index:40;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;
    box-shadow:0 6px 20px rgba(74,158,246,.42);display:flex;align-items:center;justify-content:center}
  #app.stack-open .fab,#app.stack-open .bottomnav{display:none}
  .fab:active{transform:translateX(-50%) scale(.92)}
  .fab svg{width:28px;height:28px}
  @media(min-width:520px){.fab{left:auto;right:calc(50% - 380px + 20px);transform:none}
    .fab:active{transform:scale(.92)}}
  .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:35;background:rgba(255,255,255,.94);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px 0 var(--safe-b);display:flex;justify-content:center}
  .nav-inner{display:flex;justify-content:space-around;width:100%;max-width:760px}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;
    color:var(--faint);font-size:10.5px;font-weight:600}
  .navbtn svg{width:23px;height:23px}
  .navbtn.active{color:var(--brand)}
  .navbtn.active svg{stroke-width:2.4}

  /* ── Stack ── */
  .stack{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);overscroll-behavior:contain}
  .stack.open{transform:none}
  .stack-head{position:sticky;top:0;background:rgba(247,249,243,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:11px 12px;display:flex;align-items:center;gap:8px;z-index:2}
  .stack-head h2{font-size:17px;margin:0;flex:1}
  .stack-body{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
  .stack-foot{border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b));
    background:var(--card);display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}

  .mic-wrap{position:relative}
  .mic-btn{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:10px;
    background:var(--brand-tint);color:var(--brand-dark);display:flex;align-items:center;justify-content:center}
  .mic-btn svg{width:19px;height:19px}
  .mic-btn.rec{background:var(--danger);color:#fff;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,69,63,.4)}50%{box-shadow:0 0 0 7px rgba(214,69,63,0)}}
  .mic-hint{font-size:12px;color:var(--faint);margin-top:5px}

  .seg{display:flex;background:var(--brand-tint);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
  .seg button.active{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips button{padding:8px 13px;border-radius:20px;border:1.5px solid var(--line-strong);
    background:#fff;font-size:13px;font-weight:500;color:var(--muted)}
  .chips button.active{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dark)}

  .attach-thumb{margin-top:8px;position:relative;display:inline-block}
  .attach-thumb img{max-width:140px;max-height:140px;border-radius:12px;border:1px solid var(--line)}
  .attach-thumb .rm{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;
    background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .upbar{height:5px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px;display:none}
  .upbar.show{display:block}
  .upbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}

  /* subtasks */
  .sub-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .sub-row:last-child{border-bottom:none}
  .sub-row .sbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--pending);flex:none;
    display:flex;align-items:center;justify-content:center;background:#fff}
  .sub-row .sbox.on{background:var(--brand);border-color:var(--brand)}
  .sub-row .sbox svg{width:13px;height:13px}
  .sub-row input{flex:1;border:none;background:transparent;padding:2px 0;font-size:14px}
  .sub-row input:focus{outline:none}
  .sub-row input.on{text-decoration:line-through;color:var(--faint)}
  .sub-row .sdel{color:var(--faint);width:26px;height:26px;display:flex;align-items:center;justify-content:center}

  /* ── Calendar ── */
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .cal-head h3{margin:0;font-size:16px;flex:1;text-align:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--faint);padding:4px 0}
  .cal-cell{aspect-ratio:1;border-radius:11px;background:var(--card);border:1px solid var(--line);
    padding:5px;display:flex;flex-direction:column;font-size:12px;cursor:pointer;overflow:hidden}
  .cal-cell.other{opacity:.38}
  .cal-cell.today{border-color:var(--brand);background:var(--brand-tint2)}
  .cal-cell .dnum{font-weight:600}
  .cal-cell.today .dnum{color:var(--brand-dark)}
  .cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
  .cal-dots i{width:6px;height:6px;border-radius:50%}
  .dot-pending{background:var(--pending)} .dot-doing{background:var(--amber)}
  .dot-done{background:var(--brand)} .dot-late{background:var(--danger)}
  .cal-week{display:flex;flex-direction:column;gap:8px}
  .cal-week-day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .cal-week-day.today{border-color:var(--brand)}
  .cal-week-day .wd{font-weight:700;font-size:13px;margin-bottom:6px}
  .cal-week-day.today .wd{color:var(--brand-dark)}
  .mini-task{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;
    border-top:1px dashed var(--line);cursor:pointer}
  .mini-task:first-of-type{border-top:none}
  .mini-task i{width:8px;height:8px;border-radius:50%;flex:none}

  /* ── Dashboard ── */
  .dash-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
  .dcard.late{border-color:#F0C9C7;background:#FDF4F3}
  .dcard .num{font-size:28px;font-weight:700;line-height:1}
  .dcard.late .num{color:var(--danger)}
  .dcard.done .num{color:var(--brand)}
  .dcard .lbl{font-size:11.5px;color:var(--muted);margin-top:5px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
  .panel h3{margin:0 0 12px;font-size:15px}
  .bd-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .bd-row .bd-name{width:92px;flex:none;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bd-bar{flex:1;height:9px;border-radius:6px;background:var(--brand-tint);overflow:hidden}
  .bd-bar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
  .bd-row .bd-val{width:30px;text-align:right;font-weight:600;color:var(--muted)}

  /* ── Settings ── */
  .set-group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .set-group .gh{padding:12px 15px 4px;font-size:12px;font-weight:700;color:var(--faint);
    text-transform:uppercase;letter-spacing:.4px}
  .set-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--line)}
  .set-row:first-of-type{border-top:none}
  .set-row .sr-main{flex:1;min-width:0}
  .set-row .sr-title{font-weight:500;font-size:14.5px}
  .set-row .sr-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .plan-badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700}
  .plan-free{background:var(--pending-tint);color:var(--muted)}
  .plan-premium{background:linear-gradient(135deg,#4A9EF6,#1F63B8);color:#fff}
  .profile-item{display:flex;align-items:center;gap:11px;padding:12px 15px;
    border-top:1px solid var(--line);cursor:pointer}
  .profile-item:first-of-type{border-top:none}
  .profile-item .pi-dot{width:11px;height:11px;border-radius:50%;flex:none}
  .profile-item .pi-name{flex:1;font-weight:500}
  .profile-item .pi-cur{font-size:11.5px;color:var(--brand);font-weight:700}
  .quota-bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
  .quota-bar i{display:block;height:100%;background:var(--brand)}
  .quota-bar i.warn{background:var(--amber)} .quota-bar i.full{background:var(--danger)}

  /* ── Sheet / toast ── */
  .sheet-backdrop{position:fixed;inset:0;z-index:70;background:rgba(22,35,58,.42);
    display:none;align-items:flex-end;justify-content:center}
  .sheet-backdrop.open{display:flex;animation:fade .18s ease}
  .sheet{background:var(--card);width:100%;max-width:760px;border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + var(--safe-b));animation:up .26s cubic-bezier(.4,0,.2,1);
    max-height:88dvh;overflow-y:auto}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet h3{margin:0 0 4px;font-size:18px}
  .sheet .sh-sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
  .sheet-grip{width:38px;height:4px;border-radius:3px;background:var(--line-strong);margin:0 auto 14px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe-b));
    z-index:90;background:var(--ink);color:#fff;padding:11px 16px;border-radius:24px;
    font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
    transition:opacity .2s;max-width:90%;display:flex;align-items:center;gap:12px}
  #toast.show{opacity:1;pointer-events:auto}
  #toast.err{background:var(--danger)}
  #toast .undo{color:#A9D4FF;font-weight:700;text-decoration:underline;white-space:nowrap}
  #toast.err .undo{color:#fff}

  .divider{height:1px;background:var(--line);margin:16px 0}
  .field-inline{display:flex;gap:10px}
  .field-inline > *{flex:1;min-width:0}
  /* จอแคบ: ช่องวันที่/เวลาเรียงลงมา ไม่ให้ตัวเลขถูกตัด */
  @media(max-width:430px){
    .field-inline{flex-direction:column;gap:0}
    .field-inline > .field{margin-bottom:13px}
    .field-inline > .btn{margin-bottom:8px}
  }
  .center-load{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px}
  .spinner{width:34px;height:34px;border:3px solid var(--brand-tint);border-top-color:var(--brand);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .config-warn{background:var(--danger-tint);border:1px solid #F0C9C7;color:var(--danger);
    padding:14px;border-radius:12px;font-size:13px;margin:16px;line-height:1.6}
  .config-warn code{background:#fff;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>

<div id="loading" class="center-load">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px">JodWhite…</div>
</div>

<div id="configWarn" class="config-warn hidden">
  ⚠️ ยังไม่ได้ตั้งค่า <code>FIREBASE_CONFIG</code> — เปิด <code>index.html</code> แล้ววาง config จาก Firebase Console ก่อนใช้งาน<br>
  <span style="opacity:.85">Firebase config not set. Paste it into <code>index.html</code> first.</span>
</div>

<!-- ═══════ AUTH ═══════ -->
<div id="auth" class="hidden">
  <div class="auth-card">
    <div class="auth-top">
      <div class="lang-tog"><button data-lang="th">ไทย</button><button data-lang="en">EN</button></div>
    </div>
    <div class="brand">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h9M4 11h7M4 16h5"/><path d="m12.5 15.5 3 3 6-7"/></svg>
      </div>
      <div class="wm"><span class="jod">Jod</span><span class="white">White</span></div>
      <div class="tagline" data-i18n="tagline"></div>
    </div>
    <div id="authMsg" class="auth-msg"></div>
    <div class="field" id="nameField" style="display:none">
      <label data-i18n="auth.name"></label>
      <input id="inName" class="input" type="text" autocomplete="name" data-i18n-ph="auth.namePh" />
    </div>
    <div class="field">
      <label data-i18n="auth.email"></label>
      <input id="inEmail" class="input" type="email" placeholder="you@email.com" autocomplete="email" />
    </div>
    <div class="field">
      <label data-i18n="auth.password"></label>
      <input id="inPass" class="input" type="password" autocomplete="current-password" data-i18n-ph="auth.passPh" />
    </div>
    <button id="btnAuth" class="btn btn-primary btn-block" style="margin-top:6px"></button>
    <div style="text-align:center;margin-top:10px">
      <button id="btnForgot" class="link-btn" data-i18n="auth.forgot"></button>
    </div>
    <div class="auth-switch"><span id="switchText"></span><button id="btnSwitch"></button></div>
    <div class="legal" data-i18n="auth.legal"></div>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h9M4 11h7M4 16h5"/><path d="m12.5 15.5 3 3 6-7"/></svg>
    </div>
    <div class="wm"><span class="jod">Jod</span><span class="white">White</span></div>
    <div class="spacer"></div>
    <button id="btnProfileSwitch" class="profile-switch">
      <span class="dot"></span><span id="curProfileName"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <main>
    <div id="offlineChip" class="offline-chip">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l22 22M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 5-2.6M2 8.8a15 15 0 0 1 4.2-2.6M19.9 12.5a10 10 0 0 0-4-2.4M22 8.8a15 15 0 0 0-6.3-3.5"/><circle cx="12" cy="20" r="1"/></svg>
      <span data-i18n="offline"></span>
    </div>
    <div id="verifyBanner" class="verify-banner">
      <span data-i18n="verify.msg"></span><div class="spacer"></div>
      <button id="btnResend" data-i18n="verify.resend"></button>
    </div>

    <!-- TODAY -->
    <section id="scr-today" class="screen active">
      <div class="screen-head"><h2 data-i18n="nav.today"></h2><div class="sub" id="todayDate"></div></div>
      <div class="quickadd">
        <input id="qaInput" type="text" data-i18n-ph="quickadd.ph" />
        <button id="qaBtn" aria-label="add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="searchbox">
        <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="text" data-i18n-ph="search.ph" />
        <button class="s-clear" id="searchClear">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="noDateBar" class="nodate-bar hidden">
        <button id="noDateChip" class="nodate-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 15v3M12 21h.01"/></svg>
          <span id="noDateText"></span>
        </button>
      </div>
      <div id="todayList"></div>
    </section>

    <!-- CALENDAR -->
    <section id="scr-cal" class="screen">
      <div class="screen-head"><h2 data-i18n="nav.cal"></h2></div>
      <div class="seg" style="margin-bottom:14px">
        <button id="segMonth" class="active" data-i18n="cal.month"></button>
        <button id="segWeek" data-i18n="cal.week"></button>
      </div>
      <div class="cal-head">
        <button class="icon-btn" id="calPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <h3 id="calTitle"></h3>
        <button class="icon-btn" id="calNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div id="calBody"></div>
    </section>

    <!-- DASHBOARD -->
    <section id="scr-dash" class="screen">
      <div class="screen-head"><h2 data-i18n="nav.dash"></h2><div class="sub" data-i18n="dash.sub"></div></div>
      <div class="dash-cards">
        <div class="dcard late"><div class="num" id="dLate">0</div><div class="lbl" data-i18n="dash.late"></div></div>
        <div class="dcard"><div class="num" id="dPending">0</div><div class="lbl" data-i18n="dash.pending"></div></div>
        <div class="dcard done"><div class="num" id="dDone">0</div><div class="lbl" data-i18n="dash.doneWeek"></div></div>
      </div>
      <div class="panel"><h3 data-i18n="dash.byCat"></h3><div id="catBreakdown"></div></div>
      <div class="panel"><h3 data-i18n="dash.overdueList"></h3><div id="overdueList"></div></div>
    </section>

    <!-- EXPORT -->
    <section id="scr-export" class="screen">
      <div class="screen-head"><h2 data-i18n="nav.export"></h2><div class="sub" data-i18n="export.sub"></div></div>
      <div class="panel">
        <h3 data-i18n="export.range"></h3>
        <div class="field-inline" style="margin-bottom:12px">
          <div class="field" style="margin:0"><label data-i18n="export.from"></label><input id="expFrom" class="input" type="date"/></div>
          <div class="field" style="margin:0"><label data-i18n="export.to"></label><input id="expTo" class="input" type="date"/></div>
        </div>
        <div class="field"><label data-i18n="export.profile"></label><select id="expProfile" class="input"></select></div>
        <button id="btnExport" class="btn btn-primary btn-block" style="margin-top:6px">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          <span data-i18n="export.download"></span>
        </button>
      </div>
      <div class="panel">
        <h3 data-i18n="export.ai"></h3>
        <p style="font-size:13.5px;color:var(--muted);margin:0 0 12px" data-i18n="export.aiDesc"></p>
        <button id="btnAISummary" class="btn btn-ghost btn-block" data-i18n="export.aiBtn"></button>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="scr-set" class="screen">
      <div class="screen-head"><h2 data-i18n="nav.set"></h2></div>

      <div class="set-group">
        <div class="gh" data-i18n="set.language"></div>
        <div class="set-row">
          <div class="sr-main"><div class="sr-title" data-i18n="set.langTitle"></div></div>
          <div class="lang-tog"><button data-lang="th">ไทย</button><button data-lang="en">EN</button></div>
        </div>
      </div>

      <div class="set-group">
        <div class="gh" data-i18n="set.account"></div>
        <div class="set-row">
          <div class="sr-main"><div class="sr-title" id="setEmail">—</div><div class="sr-sub" id="setVerifyStatus">—</div></div>
        </div>
        <div class="set-row">
          <div class="sr-main">
            <div class="sr-title" data-i18n="set.plan"></div>
            <div class="sr-sub" id="setQuota">—</div>
            <div class="quota-bar"><i id="quotaFill"></i></div>
          </div>
          <span id="setPlanBadge" class="plan-badge plan-free">Free</span>
        </div>
      </div>

      <div class="set-group">
        <div class="gh" data-i18n="set.profiles"></div>
        <div id="profileList"></div>
        <div class="set-row" id="btnAddProfile" style="cursor:pointer">
          <div class="sr-main"><div class="sr-title" style="color:var(--brand-dark)" data-i18n="set.addProfile"></div></div>
        </div>
      </div>

      <div class="set-group">
        <div class="gh" data-i18n="set.notify"></div>
        <div class="set-row">
          <div class="sr-main"><div class="sr-title" data-i18n="push.title"></div>
            <div class="sr-sub" id="pushStatus"></div></div>
          <div style="position:relative;display:inline-block;width:44px;height:26px;flex:none">
            <input id="togPush" type="checkbox" style="display:none"/>
            <span id="togPushUI" style="position:absolute;inset:0;background:var(--line-strong);border-radius:20px;transition:.2s;cursor:pointer"></span>
          </div>
        </div>
        <div class="set-row">
          <div class="sr-main"><div class="sr-title" data-i18n="set.lineConnect"></div>
            <div class="sr-sub" id="lineStatus"></div></div>
          <button id="btnLinkLine" class="btn btn-ghost" style="padding:9px 14px;font-size:13.5px" data-i18n="line.connectBtn"></button>
        </div>
        <div class="set-row" id="rowLineExtra" style="display:block">
          <button id="btnLineManual" class="link-btn" data-i18n="line.manual"></button>
          <div id="lineManualBox" class="hidden" style="margin-top:10px">
            <input id="lineTarget" class="input" type="text" placeholder="LINE userId / groupId" style="margin-bottom:8px"/>
            <div class="field-inline">
              <button id="btnSaveLine" class="btn btn-ghost" data-i18n="common.save"></button>
              <button id="btnTestLine" class="btn btn-line" data-i18n="set.lineTest"></button>
            </div>
          </div>
        </div>
        <div class="set-row">
          <div class="sr-main"><div class="sr-title" data-i18n="set.dailyBrief"></div>
            <div class="sr-sub" data-i18n="set.dailyBriefSub"></div></div>
          <div style="position:relative;display:inline-block;width:44px;height:26px;flex:none">
            <input id="togDaily" type="checkbox" style="display:none"/>
            <span id="togDailyUI" style="position:absolute;inset:0;background:var(--line-strong);border-radius:20px;transition:.2s;cursor:pointer"></span>
          </div>
        </div>
      </div>

      <div class="set-group">
        <div class="set-row" id="btnTrash" style="cursor:pointer">
          <div class="sr-main"><div class="sr-title" data-i18n="trash.title"></div>
            <div class="sr-sub" id="trashCount"></div></div>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="set-row" id="btnLogout" style="cursor:pointer">
          <div class="sr-main"><div class="sr-title" style="color:var(--danger)" data-i18n="set.logout"></div></div>
        </div>
        <div class="set-row" id="btnDeleteAccount" style="cursor:pointer">
          <div class="sr-main"><div class="sr-title" style="color:var(--danger)" data-i18n="set.deleteAccount"></div>
            <div class="sr-sub" data-i18n="set.deleteAccountSub"></div></div>
        </div>
      </div>
      <div style="text-align:center;color:var(--faint);font-size:12px;padding:6px 0 4px">JodWhite · v2.0</div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="new task">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="bottomnav"><div class="nav-inner">
    <button class="navbtn active" data-scr="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11 2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0h6"/></svg>
      <span data-i18n="nav.today"></span></button>
    <button class="navbtn" data-scr="cal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span data-i18n="nav.cal"></span></button>
    <button class="navbtn" data-scr="dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>
      <span data-i18n="nav.dash"></span></button>
    <button class="navbtn" data-scr="export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
      <span data-i18n="nav.export"></span></button>
    <button class="navbtn" data-scr="set">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="nav.set"></span></button>
  </div></nav>
</div>

<!-- ═══════ EDITOR ═══════ -->
<div id="editor" class="stack">
  <div class="stack-head">
    <button class="icon-btn" id="edClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <h2 id="edTitle"></h2>
    <button class="icon-btn" id="edDelete" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
  </div>
  <div class="stack-body">
    <div class="field mic-wrap">
      <label data-i18n="ed.name"></label>
      <input id="edName" class="input" type="text" data-i18n-ph="ed.namePh" />
      <button class="mic-btn" id="micName"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
      <div class="mic-hint" id="micHint"></div>
    </div>
    <div class="field mic-wrap">
      <label data-i18n="ed.detail"></label>
      <textarea id="edDetail" class="input" data-i18n-ph="ed.detailPh"></textarea>
      <button class="mic-btn" id="micDetail" style="bottom:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
    </div>
    <div class="field">
      <label data-i18n="ed.status"></label>
      <div class="seg" id="edStatusSeg">
        <button data-st="pending" class="active" data-i18n="st.pending"></button>
        <button data-st="doing" data-i18n="st.doing"></button>
        <button data-st="done" data-i18n="st.done"></button>
      </div>
    </div>
    <div class="field-inline">
      <div class="field"><label data-i18n="ed.start"></label><input id="edStart" class="input" type="datetime-local" /></div>
      <div class="field"><label data-i18n="ed.due"></label><input id="edDue" class="input" type="datetime-local" /></div>

const savedLang = localStorage.getItem('jw_lang');
let LANG = (savedLang==='th'||savedLang==='en')
  ? savedLang
  : ((navigator.language||'').toLowerCase().startsWith('th') ? 'th' : 'en');
function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || (I18N.th[key]) || key;
  if(vars) Object.keys(vars).forEach(k=> s = s.split('{'+k+'}').join(vars[k]));
  return s;
}
function locale(){ return LANG==='th' ? 'th-TH' : 'en-GB'; }
function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lang-tog button').forEach(b=> b.classList.toggle('active', b.dataset.lang===LANG));
  setAuthMode(authMode);
  if(uid){ renderProfileUI(); renderAll(); }
}
function setLang(l){
  LANG=l; localStorage.setItem('jw_lang',l);
  applyI18n();
  if(uid && db) db.collection('users').doc(uid).update({lang:l}).catch(()=>{});
}

function setAuthMode(mode){
  authMode=mode;
  $('#nameField').style.display = mode==='signup'?'block':'none';
  $('#btnAuth').textContent = mode==='signup'? t('auth.signup') : t('auth.login');
  $('#switchText').textContent = mode==='signup'? t('auth.haveAccount') : t('auth.noAccount');
  $('#btnSwitch').textContent = mode==='signup'? t('auth.login') : t('auth.signup');

function showAuthMsg(txt,type='err'){
  const el=$('#authMsg'); el.className='auth-msg'; el.textContent='';
  if(txt){ el.classList.add(type); el.textContent=txt; }
}
function authErr(code){
  const th={'auth/invalid-email':'อีเมลไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีนี้',
   'auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
   'auth/email-already-in-use':'อีเมลนี้ถูกใช้แล้ว','auth/weak-password':'รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัว)',
   'auth/too-many-requests':'พยายามหลายครั้งเกินไป ลองใหม่ภายหลัง','auth/network-request-failed':'เชื่อมต่อเครือข่ายไม่ได้'};
  const en={'auth/invalid-email':'That email address isn\'t valid','auth/user-not-found':'No account with that email',
   'auth/wrong-password':'Incorrect password','auth/invalid-credential':'Email or password is incorrect',
   'auth/email-already-in-use':'That email is already registered','auth/weak-password':'Password is too short (6+ characters)',
   'auth/too-many-requests':'Too many attempts — try again later','auth/network-request-failed':'Can\'t reach the network'};
  const m = LANG==='th'?th:en;
  return m[code] || (LANG==='th'?'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง':'Something went wrong — try again');
}
async function handleAuth(){
  const email=$('#inEmail').value.trim(), pass=$('#inPass').value;
  if(!email||!pass){ showAuthMsg(t('auth.fillBoth')); return; }
  $('#btnAuth').disabled=true;
  try{
    if(authMode==='signup'){
      const cred=await auth.createUserWithEmailAndPassword(email,pass);
      const name=$('#inName').value.trim()||email.split('@')[0];
      await cred.user.updateProfile({displayName:name});
      try{ await cred.user.sendEmailVerification(); }catch(e){}
    }else await auth.signInWithEmailAndPassword(email,pass);
  }catch(e){ showAuthMsg(authErr(e.code)); }
  finally{ $('#btnAuth').disabled=false; }
}
async function handleForgot(){
  const email=$('#inEmail').value.trim();
  if(!email){ showAuthMsg(t('auth.fillEmail')); return; }
  try{ await auth.sendPasswordResetEmail(email); showAuthMsg(t('auth.resetSent'),'ok'); }
  catch(e){ showAuthMsg(authErr(e.code)); }
}

async function bootstrapUser(user){
  const ref=db.collection('users').doc(uid);
  const snap=await ref.get();
  if(!snap.exists){
    await ref.set({email:user.email, displayName:user.displayName||'', plan:'free',
      lineTarget:'', dailyBrief:false, lang:LANG, currentProfileId:null,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      // ── สถิติพื้นฐานสำหรับดูว่าคนใช้จริงไหม ──
      stats:{signupAt:Date.now(), tasksCreated:0, lastActiveAt:Date.now()}});
  }
  userDoc=(await ref.get()).data();
  if(userDoc.lang && userDoc.lang!==LANG){ LANG=userDoc.lang; localStorage.setItem('jw_lang',LANG); applyI18n(); }
  ref.update({'stats.lastActiveAt':Date.now()}).catch(()=>{});

  const profSnap=await ref.collection('profiles').get();
  if(profSnap.empty){
    const p=await ref.collection('profiles').add({name:t('prof.default'), color:'#4A9EF6',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    currentProfileId=p.id; await ref.update({currentProfileId});
  }else currentProfileId = userDoc.currentProfileId || profSnap.docs[0].id;

  listenProfiles(); listenTasks(); listenUserDoc(); updateVerifyBanner(user);
  $('#togDaily').checked = !!userDoc.dailyBrief; paintToggles();
  purgeOldTrash();
}
function listenUserDoc(){
  if(unsubUser) unsubUser();
  unsubUser = db.collection('users').doc(uid).onSnapshot(d=>{
    if(!d.exists) return;
    const before = userDoc||{};
    userDoc = d.data();
    // บอทเชื่อม LINE ให้สำเร็จ → ปิดหน้ารหัสอัตโนมัติ
    if(!before.lineTarget && userDoc.lineTarget && $('#linkCodeBox')){
      closeSheet(); toast(t('line.linked'));
    }
    $('#togDaily').checked = !!userDoc.dailyBrief;
    renderSettings(); paintToggles();
  });
}

function listenProfiles(){
  if(unsubProfiles) unsubProfiles();
  unsubProfiles=db.collection('users').doc(uid).collection('profiles').orderBy('createdAt')
    .onSnapshot(s=>{
      profiles=s.docs.map(d=>({id:d.id,...d.data()}));
      if(!profiles.find(p=>p.id===currentProfileId)&&profiles[0]) currentProfileId=profiles[0].id;
      renderProfileUI(); renderSettings();
    });
}
function listenTasks(){
  if(unsubTasks) unsubTasks();
  unsubTasks=db.collection('users').doc(uid).collection('tasks')
    .onSnapshot(s=>{
      allTasks=s.docs.map(d=>({id:d.id,...d.data()}));
      tasks=allTasks.filter(x=>x.profileId===currentProfileId && !x.deletedAt);
      renderAll();
    }, e=>{ console.error(e); toast(t('common.loadFail'),true); });
}

function renderAll(){ renderToday(); renderCalendar(); renderDashboard(); renderCatList(); renderSettings(); renderTrash(); }
function statusClass(s){ return s==='done'?'s-done':s==='doing'?'s-doing':'s-pending'; }
function isOverdue(t2){ return t2.status!=='done' && t2.dueAt&&t2.dueAt.toMillis && t2.dueAt.toMillis()<Date.now(); }
function fmtTime(ts){ if(!ts||!ts.toDate)return''; return ts.toDate().toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(ts){ if(!ts||!ts.toDate)return''; return ts.toDate().toLocaleDateString(locale(),{day:'numeric',month:'short'}); }
function dayKey(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
// ป้ายวันแบบสัมพัทธ์: พรุ่งนี้ / มะรืนนี้ / ชื่อวัน + วันที่
function relDayLabel(d){
  const now=new Date(); const t0=new Date(now); t0.setHours(0,0,0,0);
  const diff=Math.round((new Date(d).setHours(0,0,0,0)-t0)/86400000);
  if(diff===1) return t('day.tomorrow');
  if(diff===2 && LANG==='th') return t('day.dayAfter');
  return d.toLocaleDateString(locale(),{weekday:'long',day:'numeric',month:'short'});
}
function byDue(a,b){ const am=a.dueAt&&a.dueAt.toMillis?a.dueAt.toMillis():Infinity;
  const bm=b.dueAt&&b.dueAt.toMillis?b.dueAt.toMillis():Infinity; return am-bm; }

function taskCardHTML(x){
  const over=isOverdue(x);
  const check = x.status==='done'?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>'
    : x.status==='doing'?'<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="5"/></svg>':'';
  const dueTxt = x.dueAt? (fmtDate(x.dueAt)+' '+fmtTime(x.dueAt)) : '';
  const subs=x.subtasks||[]; const subDone=subs.filter(s=>s.done).length;
  return `<div class="task ${x.status==='done'?'done':''} ${over?'overdue':''}">
    <div class="task-top">
      <div class="status-pill ${statusClass(x.status)}"><button data-cycle="${x.id}">${check}</button></div>
      <div class="task-body" data-open="${x.id}">
        <div class="task-title">${esc(x.title)}</div>
        ${x.detail?`<div class="task-detail-txt">${esc(x.detail)}</div>`:''}
        <div class="task-meta">
          ${dueTxt?`<span class="m due ${over?'late':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${dueTxt}${over?' · '+t('group.overdue'):''}</span>`:''}
          ${x.repeat&&x.repeat!=='none'?`<span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>${t('rp.'+x.repeat)}</span>`:''}
          ${x.involved?`<span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>${esc(x.involved)}</span>`:''}
          ${x.place?`<span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(x.place)}</span>`:''}
        </div>
        ${subs.length?`<div class="sub-prog"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>${subDone}/${subs.length}</div>`:''}
        ${x.category?`<span class="tag">${esc(x.category)}</span>`:''}
        ${x.photoUrl?`<img class="task-thumb" src="${x.photoUrl}" loading="lazy" alt=""/>`:''}
      </div>
    </div></div>`;
}

function renderToday(){
  const now=new Date();
  $('#todayDate').textContent = now.toLocaleDateString(locale(),{weekday:'long',day:'numeric',month:'long'});
  if(searchTerm){
    renderNoDateBar(0);   // ซ่อนแถบระหว่างค้นหา
    const q=searchTerm.toLowerCase();
    const res=tasks.filter(x=>[x.title,x.detail,x.category,x.involved,x.place]
      .filter(Boolean).some(v=>v.toLowerCase().includes(q))).sort(byDue);
    $('#todayList').innerHTML = res.length
      ? `<div class="day-label">${t('search.results')} · ${res.length}</div>`+res.map(taskCardHTML).join('')
      : `<div class="empty"><div class="em-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div><h3>${t('search.none')}</h3></div>`;
    return;
  }
  const s=new Date(now); s.setHours(0,0,0,0);
  const e=new Date(now); e.setHours(23,59,59,999);
  const over=tasks.filter(isOverdue);
  // งานวันนี้ที่ "ยังไม่เสร็จ" (งานเสร็จแยกไปกลุ่มพับด้านล่าง)
  const today=tasks.filter(x=>x.dueAt&&x.dueAt.toDate&&x.dueAt.toDate()>=s&&x.dueAt.toDate()<=e
    && !isOverdue(x) && x.status!=='done');
  // งาน 3 วันข้างหน้า (พรุ่งนี้ถึงอีก 3 วัน) — ยังไม่เสร็จ เรียงตามกำหนด
  const upEnd=new Date(now); upEnd.setDate(upEnd.getDate()+3); upEnd.setHours(23,59,59,999);
  const upcoming=tasks.filter(x=>x.dueAt&&x.dueAt.toDate
    && x.dueAt.toDate()>e && x.dueAt.toDate()<=upEnd
    && x.status!=='done').sort(byDue);
  // งานที่เสร็จแล้ววันนี้ (มีวันกำหนดในวันนี้ หรือปิดงานวันนี้) — รวมไว้กลุ่มพับล่างสุด
  const doneToday=tasks.filter(x=>x.status==='done' && x.dueAt && x.dueAt.toDate
    && ((x.dueAt.toDate()>=s && x.dueAt.toDate()<=e)
        || (x.updatedAt&&x.updatedAt.toDate&&x.updatedAt.toDate()>=s&&x.updatedAt.toDate()<=e)))
    .sort((a,b)=>{const am=a.updatedAt&&a.updatedAt.toMillis?a.updatedAt.toMillis():0;
      const bm=b.updatedAt&&b.updatedAt.toMillis?b.updatedAt.toMillis():0; return bm-am;});
  // งานที่ยังไม่กำหนดวัน — แสดงทุกสถานะ หายก็ต่อเมื่อกดลบเท่านั้น

  const noDate=tasks.filter(x=>!x.dueAt).sort((a,b)=>
    (a.status==='done'?1:0)-(b.status==='done'?1:0));

  }
  if(over.length) h+=`<div class="day-label" style="color:var(--danger)">${t('group.overdue')}</div>`+over.sort(byDue).map(taskCardHTML).join('');
  if(today.length) h+=`<div class="day-label">${t('group.today')}</div>`+today.sort(byDue).map(taskCardHTML).join('');
  if(upcoming.length){
    h+=`<div class="day-label">${t('group.upcoming')} · ${upcoming.length}</div>`;
    // แบ่งย่อยตามวัน ให้กวาดตาดูง่ายว่าอันไหนพรุ่งนี้ อันไหนมะรืน
    let lastKey='';
    upcoming.forEach(x=>{
      const d=x.dueAt.toDate(), k=dayKey(d);
      if(k!==lastKey){ lastKey=k;
        h+=`<div class="sub-day">${relDayLabel(d)}</div>`;
      }
      h+=taskCardHTML(x);
    });
  }
  if(noDate.length) h+=`<div class="day-label">${t('group.noDate')} · ${noDate.length}</div>`+noDate.map(taskCardHTML).join('');
  // กลุ่มงานเสร็จวันนี้ — พับเก็บล่างสุด กดกางเพื่อดู
  if(doneToday.length){
    h+=`<button class="done-toggle ${doneExpanded?'open':''}" id="doneToggle">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      <span>${t('group.doneToday')} · ${doneToday.length}</span></button>`;
    if(doneExpanded) h+=`<div class="done-wrap">`+doneToday.map(taskCardHTML).join('')+`</div>`;
  }
  if(!h) h=`<div class="empty"><div class="em-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
    <h3>${t('empty.title')}</h3><p>${t('empty.desc')}</p></div>`;
  $('#todayList').innerHTML=h;
}

/* Calendar */
function renderCalendar(){ calMode==='month'?renderMonth():renderWeek(); }
function renderMonth(){
  const y=calCursor.getFullYear(), m=calCursor.getMonth();
  $('#calTitle').textContent=calCursor.toLocaleDateString(locale(),{month:'long',year:'numeric'});
  const startDow=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), today=new Date();
  const dows=LANG==='th'?['อา','จ','อ','พ','พฤ','ศ','ส']:['S','M','T','W','T','F','S'];
  let h='<div class="cal-grid">'+dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const prev=new Date(y,m,0).getDate();
  for(let i=startDow-1;i>=0;i--) h+=cellHTML(new Date(y,m-1,prev-i),true);
  for(let d=1;d<=dim;d++) h+=cellHTML(new Date(y,m,d),false,today);
  const trail=(7-((startDow+dim)%7))%7;
  for(let d=1;d<=trail;d++) h+=cellHTML(new Date(y,m+1,d),true);
  $('#calBody').innerHTML=h+'</div>';
}
function cellHTML(date,other,today){
  const key=dayKey(date);
  const dt=tasks.filter(x=>x.dueAt&&x.dueAt.toDate&&dayKey(x.dueAt.toDate())===key);
  const isT=today&&dayKey(date)===dayKey(today);
  const dots=dt.slice(0,4).map(x=>`<i class="${isOverdue(x)?'dot-late':x.status==='done'?'dot-done':x.status==='doing'?'dot-doing':'dot-pending'}"></i>`).join('');
  return `<div class="cal-cell ${other?'other':''} ${isT?'today':''}" data-day="${date.toISOString()}">
    <div class="dnum">${date.getDate()}</div><div class="cal-dots">${dots}</div></div>`;
}
function renderWeek(){
  const cur=new Date(calCursor), mon=new Date(cur); mon.setDate(cur.getDate()-cur.getDay());
  const end=new Date(mon); end.setDate(mon.getDate()+6); const today=new Date();
  $('#calTitle').textContent=`${mon.toLocaleDateString(locale(),{day:'numeric',month:'short'})} – ${end.toLocaleDateString(locale(),{day:'numeric',month:'short'})}`;
  let h='<div class="cal-week">';
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const dt=tasks.filter(x=>x.dueAt&&x.dueAt.toDate&&dayKey(x.dueAt.toDate())===dayKey(d)).sort(byDue);
    h+=`<div class="cal-week-day ${dayKey(d)===dayKey(today)?'today':''}">
      <div class="wd">${d.toLocaleDateString(locale(),{weekday:'long'})} ${d.getDate()}</div>`;
    if(dt.length) dt.forEach(x=>{h+=`<div class="mini-task" data-open="${x.id}"><i class="${isOverdue(x)?'dot-late':x.status==='done'?'dot-done':x.status==='doing'?'dot-doing':'dot-pending'}"></i>${fmtTime(x.dueAt)} · ${esc(x.title)}</div>`;});
    else h+=`<div style="font-size:12.5px;color:var(--faint);padding:3px 0">—</div>`;
    h+='</div>';
  }
  $('#calBody').innerHTML=h+'</div>';
}
/* Dashboard */
function renderDashboard(){
  const over=tasks.filter(isOverdue), pend=tasks.filter(x=>x.status!=='done'&&!isOverdue(x));
  const ws=new Date(); ws.setDate(ws.getDate()-ws.getDay()); ws.setHours(0,0,0,0);
  const doneW=tasks.filter(x=>x.status==='done'&&x.updatedAt&&x.updatedAt.toDate&&x.updatedAt.toDate()>=ws);
  $('#dLate').textContent=over.length; $('#dPending').textContent=pend.length; $('#dDone').textContent=doneW.length;
  const open=tasks.filter(x=>x.status!=='done'), cats={};
  open.forEach(x=>{const c=x.category||t('dash.uncat');cats[c]=(cats[c]||0)+1;});
  const max=Math.max(1,...Object.values(cats)), rows=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  $('#catBreakdown').innerHTML = rows.length? rows.map(([c,n])=>
    `<div class="bd-row"><div class="bd-name">${esc(c)}</div><div class="bd-bar"><i style="width:${Math.round(n/max*100)}%"></i></div><div class="bd-val">${n}</div></div>`).join('')
    : `<div style="color:var(--faint);font-size:13px">${t('dash.noOpen')}</div>`;
  $('#overdueList').innerHTML = over.length? over.sort(byDue).map(x=>
    `<div class="mini-task" data-open="${x.id}"><i class="dot-late"></i>${esc(x.title)} · <span style="color:var(--danger)">${fmtDate(x.dueAt)}</span></div>`).join('')

}

function openEditor(id){
  editingId=id||null; editPhotoFile=null; editPhotoUrl=null; editPhotoPath=null;
  $('#photoPreview').innerHTML=''; $('#edPhoto').value=''; $('#upBar').classList.remove('show');
  if(id){
    const x=allTasks.find(a=>a.id===id); if(!x)return;
    $('#edTitle').textContent=t('ed.editTask'); $('#edDelete').style.display='flex';
    $('#edName').value=x.title||''; $('#edDetail').value=x.detail||'';
    $('#edCategory').value=x.category||''; $('#edInvolved').value=x.involved||'';
    $('#edPlace').value=x.place||'';
    $('#edStart').value=tsToLocal(x.startAt); $('#edDue').value=tsToLocal(x.dueAt);
    setEditStatus(x.status||'pending'); setRemind(x.remindOffsetMin||0); setRepeat(x.repeat||'none');
    editSubs=(x.subtasks||[]).map(s=>({...s}));
    if(x.photoUrl){ editPhotoUrl=x.photoUrl; editPhotoPath=x.photoPath||null; showPhotoPreview(x.photoUrl); }
  }else{
    const plan=(userDoc&&userDoc.plan)||'free';
    const active=tasks.filter(x=>x.status!=='done').length;
    if(plan!=='premium' && active>=FREE_LIMITS.activeTasks){
      showUpgrade(t('up.limitTasks',{n:FREE_LIMITS.activeTasks})); return;
    }
    $('#edTitle').textContent=t('ed.newTask'); $('#edDelete').style.display='none';
    ['#edName','#edDetail','#edCategory','#edInvolved','#edPlace','#edStart','#edDue'].forEach(s=>$(s).value='');
    setEditStatus('pending'); setRemind(0); setRepeat('none'); editSubs=[];
  }
  renderSubs();
  $('#editor').classList.add('open'); $('#app').classList.add('stack-open');
}
function closeEditor(){ $('#editor').classList.remove('open'); $('#app').classList.remove('stack-open'); }

function tsToLocal(ts){ if(!ts||!ts.toDate)return'';

function localToDate(v){ return v? new Date(v):null; }

async function saveTask(){
  const title=$('#edName').value.trim();
  if(!title){ toast(t('ed.needName'),true); return; }
  const due=localToDate($('#edDue').value), start=localToDate($('#edStart').value);
  const remindAt=(editRemindMin>0&&due)? new Date(due.getTime()-editRemindMin*60000):null;
  const subs=editSubs.filter(s=>(s.text||'').trim()).map(s=>({text:s.text.trim(),done:!!s.done}));
  const data={
    profileId:currentProfileId, ownerUid:uid, title,
    detail:$('#edDetail').value.trim(), category:$('#edCategory').value.trim(),
    involved:$('#edInvolved').value.trim(), place:$('#edPlace').value.trim(),
    status:editStatus, subtasks:subs, repeat:editRepeat,
    startAt: start? firebase.firestore.Timestamp.fromDate(start):null,
    dueAt: due? firebase.firestore.Timestamp.fromDate(due):null,
    remindOffsetMin:editRemindMin,
    remindAt: remindAt? firebase.firestore.Timestamp.fromDate(remindAt):null,
    reminderSent:false, deletedAt:null,
    lang:LANG,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  $('#edSave').disabled=true;
  try{
    const col=db.collection('users').doc(uid).collection('tasks');
    let taskId=editingId;
    if(editingId){
      const prev=allTasks.find(a=>a.id===editingId);
      if(prev && prev.status!==editStatus)
        data.history=(prev.history||[]).concat([{at:Date.now(),type:'status',from:prev.status,to:editStatus}]);
      if(editPhotoUrl===null && prev && prev.photoPath) await deletePhoto(prev.photoPath);
      data.photoUrl=editPhotoUrl; data.photoPath=editPhotoPath;
      await col.doc(editingId).update(data);
    }else{
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      data.history=[{at:Date.now(),type:'create'}];
      data.photoUrl=null; data.photoPath=null;
      const ref=await col.add(data); taskId=ref.id;
      db.collection('users').doc(uid).update({'stats.tasksCreated':firebase.firestore.FieldValue.increment(1)}).catch(()=>{});
    }
    if(editPhotoFile){
      toast(t('ed.uploading'));
      const up=await uploadPhoto(editPhotoFile, taskId);
      if(up) await col.doc(taskId).update({photoUrl:up.url, photoPath:up.path});
    }
    toast(editingId? t('ed.saved'):t('ed.added'));
    // หมายเหตุ: ไม่ส่ง LINE ตอนเพิ่ม/ปิดงาน เพื่อประหยัดโควตาข้อความ
    // การแจ้งเตือนจริงมาจากฝั่งเซิร์ฟเวอร์ (เตือนก่อนกำหนด + สรุปเช้า)
    closeEditor();
  }catch(e){ console.error(e); toast(t('ed.saveFail'),true); }
  finally{ $('#edSave').disabled=false; }
}

/* ── Soft delete + undo ── */
async function softDelete(id){
  const x=allTasks.find(a=>a.id===id); if(!x)return;
  await db.collection('users').doc(uid).collection('tasks').doc(id)
    .update({deletedAt:firebase.firestore.Timestamp.now()});
  toastUndo(t('ed.deleted'), async()=>{
    await db.collection('users').doc(uid).collection('tasks').doc(id).update({deletedAt:null});
    toast(t('trash.restored'));
  });
}
async function restoreTask(id){
  await db.collection('users').doc(uid).collection('tasks').doc(id).update({deletedAt:null});
  toast(t('trash.restored'));
}
async function purgeTask(id){
  const x=allTasks.find(a=>a.id===id);
  if(x&&x.photoPath) await deletePhoto(x.photoPath);
  await db.collection('users').doc(uid).collection('tasks').doc(id).delete();
  toast(t('trash.deleted'));
}
async function purgeOldTrash(){
  const cutoff=Date.now()-TRASH_DAYS*86400000;
  setTimeout(()=>{
    trashed().forEach(x=>{
      const ms=x.deletedAt&&x.deletedAt.toMillis? x.deletedAt.toMillis():0;
      if(ms&&ms<cutoff) purgeTask(x.id).catch(()=>{});
    });
  },3000);
}
function renderTrash(){
  const list=trashed().sort((a,b)=>(b.deletedAt&&b.deletedAt.toMillis?b.deletedAt.toMillis():0)-(a.deletedAt&&a.deletedAt.toMillis?a.deletedAt.toMillis():0));
  $('#trashList').innerHTML = list.length? list.map(x=>{
    const left=TRASH_DAYS-Math.floor((Date.now()-(x.deletedAt&&x.deletedAt.toMillis?x.deletedAt.toMillis():Date.now()))/86400000);
    return `<div class="task"><div class="task-top"><div class="task-body">

        <button class="btn btn-danger" style="padding:8px 14px;font-size:13px" data-purge="${x.id}">${t('trash.purge')}</button>
      </div></div></div></div>`;}).join('')
    : `<div class="empty"><h3>${t('trash.empty')}</h3></div>`;

async function cycleStatus(id){
  const x=allTasks.find(a=>a.id===id); if(!x)return;
  const order=['pending','doing','done'];
  const next=order[(order.indexOf(x.status||'pending')+1)%3];
  try{
    await db.collection('users').doc(uid).collection('tasks').doc(id).update({
      status:next, updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
      history:(x.history||[]).concat([{at:Date.now(),type:'status',from:x.status,to:next}])});
    if(next==='done' && x.repeat && x.repeat!=='none') await spawnNext(x);
  }catch(e){ toast(t('common.fail'),true); }
}
/* ── งานประจำ: สร้างรอบถัดไปเมื่อปิดงาน ── */
async function spawnNext(x){
  if(!x.dueAt||!x.dueAt.toDate) return;
  const step=d=>{ const n=new Date(d);
    if(x.repeat==='daily') n.setDate(n.getDate()+1);
    else if(x.repeat==='weekly') n.setDate(n.getDate()+7);
    else n.setMonth(n.getMonth()+1);
    return n; };
  const nextDue=step(x.dueAt.toDate());
  const nextStart=x.startAt&&x.startAt.toDate? step(x.startAt.toDate()):null;
  const remindAt=(x.remindOffsetMin>0)? new Date(nextDue.getTime()-x.remindOffsetMin*60000):null;
  await db.collection('users').doc(uid).collection('tasks').add({
    profileId:x.profileId, ownerUid:uid, title:x.title, detail:x.detail||'',
    category:x.category||'', involved:x.involved||'', place:x.place||'',
    status:'pending', subtasks:(x.subtasks||[]).map(s=>({text:s.text,done:false})),
    repeat:x.repeat, lang:x.lang||LANG,
    startAt: nextStart? firebase.firestore.Timestamp.fromDate(nextStart):null,
    dueAt: firebase.firestore.Timestamp.fromDate(nextDue),
    remindOffsetMin:x.remindOffsetMin||0,
    remindAt: remindAt? firebase.firestore.Timestamp.fromDate(remindAt):null,
    reminderSent:false, deletedAt:null, photoUrl:null, photoPath:null,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    history:[{at:Date.now(),type:'repeat',from:x.id}]
  });
  toast(t('rp.next'));
}

async function handlePhotoPick(file){
  if(!file)return;
  editPhotoFile=file;
  try{ showPhotoPreview(await compressPreview(file)); }catch(e){}
}
function compressPreview(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const sc=Math.min(1,400/img.width), c=document.createElement('canvas');
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.7)); };
    img.onerror=rej; img.src=url;
  });
}
function compressBlob(file,maxW=1400,q=.72){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const sc=Math.min(1,maxW/img.width), c=document.createElement('canvas');
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q); };
    img.onerror=rej; img.src=url;
  });
}
async function uploadPhoto(file, taskId){
  try{
    const blob=await compressBlob(file);
    const path=`users/${uid}/tasks/${taskId}/photo_${Date.now()}.jpg`;
    const ref=storage.ref(path);
    const bar=$('#upBar'); bar.classList.add('show');
    const task=ref.put(blob,{contentType:'image/jpeg'});
    await new Promise((res,rej)=>{
      task.on('state_changed',
        s=>{ bar.querySelector('i').style.width=Math.round(s.bytesTransferred/s.totalBytes*100)+'%'; },
        rej, res);
    });
    bar.classList.remove('show');
    return {url: await ref.getDownloadURL(), path};
  }catch(e){ console.error(e); toast(t('ed.photoFail'),true); $('#upBar').classList.remove('show'); return null; }
}
async function deletePhoto(path){ try{ await storage.ref(path).delete(); }catch(e){} }

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null, recTarget=null;
function setupMic(btnSel,inputSel){
  const btn=$(btnSel), input=$(inputSel);
  if(!SR){ btn.addEventListener('click',()=>{ input.focus();
      $('#micHint').textContent=t('mic.unsupported'); setTimeout(()=>$('#micHint').textContent='',4500); });
    return; }
  btn.addEventListener('click',()=>{
    if(recog&&recTarget===input){ recog.stop(); return; }
    if(recog) recog.stop();
    recog=new SR(); recog.lang= LANG==='th'?'th-TH':'en-US';
    recog.interimResults=true; recTarget=input;
    const base=input.value? input.value+' ':'';
    btn.classList.add('rec');
    recog.onresult=e=>{ let s=''; for(let i=e.resultIndex;i<e.results.length;i++) s+=e.results[i][0].transcript;
      input.value=base+s; };
    recog.onerror=()=>{ btn.classList.remove('rec'); recog=null; recTarget=null; };
    recog.onend=()=>{ btn.classList.remove('rec'); recog=null; recTarget=null; };
    recog.start();
  });
}

/* ╔════════════════════════════════════════════════════════════╗
   ║ 9b) Push notification (ฟรี ไม่จำกัดจำนวน)                    ║
   ╚════════════════════════════════════════════════════════════╝ */
function pushSupported(){
  return !!messaging && 'Notification' in window && 'serviceWorker' in navigator;
}
async function enablePush(){
  if(!pushSupported()){ toast(t('push.unsupported'),true); return false; }
  if(!VAPID_KEY || VAPID_KEY==='PASTE_HERE'){ toast(t('push.noKey'),true); return false; }
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast(t('push.denied'),true); return false; }
    const reg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    if(!token){ toast(t('push.fail'),true); return false; }
    await db.collection('users').doc(uid).update({
      pushTokens: firebase.firestore.FieldValue.arrayUnion(token)
    });
    localStorage.setItem('jw_push_token', token);
    toast(t('push.enabled'));
    return true;
  }catch(e){ console.error(e); toast(t('push.fail'),true); return false; }
}
async function disablePush(){
  const tk = localStorage.getItem('jw_push_token');
  try{
    if(tk) await db.collection('users').doc(uid).update({
      pushTokens: firebase.firestore.FieldValue.arrayRemove(tk)
    });
    if(messaging) await messaging.deleteToken().catch(()=>{});
  }catch(e){}
  localStorage.removeItem('jw_push_token');
  toast(t('push.disabled'));
}
function pushIsOn(){
  const tk=localStorage.getItem('jw_push_token');
  return !!tk && Array.isArray(userDoc&&userDoc.pushTokens) && userDoc.pushTokens.includes(tk)
         && ('Notification' in window) && Notification.permission==='granted';
}

function exportExcel(){
  const from=$('#expFrom').value? new Date($('#expFrom').value):null;
  const to=$('#expTo').value? new Date($('#expTo').value+'T23:59:59'):null;
  const pid=$('#expProfile').value;
  let rows=liveTasks().filter(x=> pid==='__all'?true:x.profileId===pid);
  if(from) rows=rows.filter(x=>x.dueAt&&x.dueAt.toDate&&x.dueAt.toDate()>=from);
  if(to) rows=rows.filter(x=>x.dueAt&&x.dueAt.toDate&&x.dueAt.toDate()<=to);
  if(!rows.length){ toast(t('export.none'),true); return; }
  const pm={}; profiles.forEach(p=>pm[p.id]=p.name);
  const H = LANG==='th'
    ? ['โปรไฟล์','ชื่องาน','รายละเอียด','หมวดหมู่','คนสั่ง/เกี่ยวข้อง','สถานที่','เริ่ม','กำหนดเสร็จ','สถานะ','งานย่อย']
    : ['Profile','Task','Details','Category','Requested by','Location','Starts','Due','Status','Subtasks'];
  const data=rows.sort(byDue).map(x=>{
    const subs=x.subtasks||[];
    const o={};
    o[H[0]]=pm[x.profileId]||''; o[H[1]]=x.title||''; o[H[2]]=x.detail||'';
    o[H[3]]=x.category||''; o[H[4]]=x.involved||''; o[H[5]]=x.place||'';
    o[H[6]]=x.startAt&&x.startAt.toDate?x.startAt.toDate().toLocaleString(locale()):'';
    o[H[7]]=x.dueAt&&x.dueAt.toDate?x.dueAt.toDate().toLocaleString(locale()):'';
    o[H[8]]=t('st.'+(x.status||'pending'));
    o[H[9]]=subs.length? `${subs.filter(s=>s.done).length}/${subs.length}`:'';
    return o;
  });
  const ws=XLSX.utils.json_to_sheet(data);
  ws['!cols']=[{wch:14},{wch:28},{wch:32},{wch:14},{wch:18},{wch:20},{wch:20},{wch:20},{wch:10},{wch:10}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,LANG==='th'?'งาน':'Tasks');
  XLSX.writeFile(wb,`JodWhite_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast(t('export.done'));
}

  $('#btnLogout').onclick=()=>showConfirm(t('set.logoutQ'),'',()=>auth.signOut());
  $('#btnDeleteAccount').onclick=deleteAccount;
  $('#btnResend').onclick=async()=>{ try{ await auth.currentUser.sendEmailVerification(); toast(t('verify.sent')); }
    catch(e){ toast(t('common.fail'),true); } };
  $('#btnSaveLine').onclick=async()=>{
    const v=$('#lineTarget').value.trim();
    await db.collection('users').doc(uid).update({lineTarget:v});
    userDoc.lineTarget=v; renderSettings(); toast(t('set.lineSaved'));
  };
  $('#btnTestLine').onclick=()=>{
    const v=$('#lineTarget').value.trim();
    if(!v){ toast(t('set.lineNeedId'),true); return; }
    userDoc.lineTarget=v; notifyLine(t('line.test')); toast(t('set.lineSent'));
  };
  $('#togDailyUI').onclick=async ()=>{
    const c=$('#togDaily'); c.checked=!c.checked;
    paintToggles();                       // วาดสีทันทีก่อน ให้เห็นผลเลย
    userDoc.dailyBrief=c.checked;
    try{ await db.collection('users').doc(uid).update({dailyBrief:c.checked}); }
    catch(err){ toast(t('common.fail'),true); }
  };

  // สวิตช์แจ้งเตือนบนเครื่อง
  $('#togPushUI').onclick=async ()=>{
    const c=$('#togPush'); if(c.disabled){ toast(t('push.unsupported'),true); return; }
    if(c.checked){ await disablePush(); } else { await enablePush(); }
    renderSettings(); paintToggles();
  };

  // เชื่อม / ยกเลิกเชื่อม LINE
  $('#btnLinkLine').onclick=()=>{
    if(userDoc && userDoc.lineTarget)
      showConfirm(t('line.disconnect'),'',()=>unlinkLine());
    else startLineLink();
  };
  $('#btnLineManual').onclick=()=>{ $('#lineManualBox').classList.toggle('hidden'); };

  $('#sheetBackdrop').onclick=e=>{ if(e.target.id==='sheetBackdrop') closeSheet(); };

  const now=new Date();
  $('#expFrom').value=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
  $('#expTo').value=now.toISOString().slice(0,10);
}
function registerSW(){ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); }

boot();
</script>
</body>
</html>
